# Configuration form for TTS-STT Studio when it is installed from a custom catalog.
#
# The answers become `values` in templates/docker-compose.yaml. tests/test_truenas_catalog.py
# checks that every question is used by the template and every value the template reads is asked
# here, and that the rendered stack matches docker-compose.truenas-app.yml.
#
# STATUS: a scaffold. TrueNAS renders catalog apps with its own ix-lib helpers and expects the
# repository in the trains/<train>/<app>/<version>/ layout, which this directory is not. It has
# never been loaded by a real TrueNAS. The supported install path is Install via YAML with
# docker-compose.truenas-app.yml (see truenas/README.md).

groups:
  - name: Storage
    description: Where models, cache, voices and generated audio live
  - name: Release
    description: Which version runs, and how updates arrive
  - name: Network
    description: Ports
  - name: GPU
    description: NVIDIA acceleration
  - name: Optional services
    description: Heavier backends, off by default (each adds VRAM)
  - name: Models
    description: Which models the engines load
  - name: Access
    description: Browser access, reverse proxy, API key

questions:
  # --- Storage ---
  - variable: storage_type
    label: Storage type
    description: >-
      Host path uses a dataset you created (snapshots and shares work as you set them up).
      ixVolume lets TrueNAS create a dataset on the Apps pool for you.
    group: Storage
    schema:
      type: string
      default: host_path
      required: true
      enum:
        - {value: host_path, description: Host path (a dataset you created, recommended)}
        - {value: ix_volume, description: ixVolume (dataset created by TrueNAS on the Apps pool)}

  - variable: host_path
    label: Data dataset (host path)
    description: >-
      Models, cache, saved voices and output are stored here, in subdirectories the app creates.
      Create the dataset first (Datasets -> Add Dataset). Example: /mnt/tank/apps/tts-stt
    group: Storage
    schema:
      type: hostpath
      show_if: [["storage_type", "=", "host_path"]]
      required: true

  - variable: ix_volume_dataset
    label: ixVolume dataset name
    group: Storage
    schema:
      type: string
      default: data
      show_if: [["storage_type", "=", "ix_volume"]]
      required: true

  # --- Release ---
  - variable: image_tag
    label: Release (image tag)
    description: >-
      A pinned release changes only when you change it. "latest" follows the newest build and
      should go with Pull policy "always". Snapshot the dataset before changing this.
    group: Release
    schema:
      type: string
      default: "0.2.0"
      required: true

  - variable: pull_policy
    label: Pull policy
    description: >-
      missing = pull only images the host does not have (use with a pinned release).
      always = pull on every start, so "latest" really updates.
    group: Release
    schema:
      type: string
      default: missing
      enum:
        - {value: missing, description: missing (pinned release)}
        - {value: always, description: always (follow "latest")}

  - variable: image_registry
    label: Image registry / owner
    description: Change only for a fork; images are named <registry>/tts-stt-<service>.
    group: Release
    schema:
      type: string
      default: ghcr.io/steffenhebestreit

  # --- Network ---
  - variable: frontend_port
    label: Web UI port
    group: Network
    schema:
      type: int
      default: 3000
      min: 1
      max: 65535
      required: true

  - variable: expose_backend_ports
    label: Also publish backend ports on this host (127.0.0.1 only)
    description: >-
      Not needed for the web UI: it reaches every backend through the frontend, live microphone
      included. Turn this on only to call the TTS/STT APIs from a script on the NAS itself.
    group: Network
    schema:
      type: boolean
      default: false

  # --- GPU ---
  - variable: use_gpu
    label: Use NVIDIA GPU
    description: >-
      Off runs only the web UI, Piper and Whisper on the CPU (slow); the Qwen and optional GPU
      services are not started.
    group: GPU
    schema:
      type: boolean
      default: true

  - variable: gpu_device_id
    label: GPU
    description: Index or GPU-xxxx UUID from `nvidia-smi -L`. A single-GPU host uses 0.
    group: GPU
    schema:
      type: string
      default: "0"
      show_if: [["use_gpu", "=", true]]

  # --- Optional services ---
  - variable: enable_canary
    label: Canary-ASR (fastest German STT, 180M parameters, about 2 GB VRAM)
    group: Optional services
    schema:
      type: boolean
      default: false
      show_if: [["use_gpu", "=", true]]

  - variable: enable_parakeet
    label: Parakeet-ASR (25 European languages, about 3 GB VRAM)
    group: Optional services
    schema:
      type: boolean
      default: false
      show_if: [["use_gpu", "=", true]]

  - variable: enable_chatterbox
    label: Chatterbox-TTS (streaming German TTS with cloning, about 4 GB VRAM)
    description: The only TTS backend that streams sentence by sentence, so speech starts early.
    group: Optional services
    schema:
      type: boolean
      default: false
      show_if: [["use_gpu", "=", true]]

  - variable: enable_magpie
    label: Magpie-TTS (NVIDIA, 5 built-in voices, about 4 GB VRAM)
    description: >-
      German, English, Spanish, French, Japanese and Chinese; reads digits, dates and times
      correctly. No voice cloning and no streaming. NVIDIA Open Model License.
    group: Optional services
    schema:
      type: boolean
      default: false
      show_if: [["use_gpu", "=", true]]

  - variable: enable_training
    label: Voice training
    description: >-
      Runs the training service and shows the Voice Training tab in the web UI. Run it on demand:
      an idle container still holds a CUDA context (about 0.5 GB).
    group: Optional services
    schema:
      type: boolean
      default: false
      show_if: [["use_gpu", "=", true]]

  - variable: enable_whisper_cpp
    label: whisper.cpp (CPU-only STT, OpenAI-compatible)
    group: Optional services
    schema:
      type: boolean
      default: false

  # --- Models ---
  - variable: whisper_model_size
    label: Whisper model
    description: >-
      large-v3-turbo is the best latency/accuracy trade for live transcription but cannot
      translate. Choose large-v3 if you need speech translation.
    group: Models
    schema:
      type: string
      default: large-v3-turbo
      enum:
        - {value: large-v3-turbo, description: large-v3-turbo (recommended, about 1.6 GB VRAM)}
        - {value: large-v3, description: large-v3 (best accuracy, can translate, about 3.1 GB VRAM)}
        - {value: medium, description: medium}
        - {value: small, description: small}
        - {value: base, description: base}
        - {value: tiny, description: tiny (fastest, lowest accuracy)}

  - variable: stt_default_language
    label: Default transcription language
    description: >-
      Language for API requests that name none. de is German-first; leave empty to auto-detect.
      The web UI sends its own choice.
    group: Models
    schema:
      type: string
      default: de

  - variable: qwen3_tts_model
    label: Qwen3-TTS model
    group: Models
    schema:
      type: string
      default: Qwen/Qwen3-TTS-12Hz-0.6B-Base
      enum:
        - {value: Qwen/Qwen3-TTS-12Hz-0.6B-Base, description: 0.6B Base (about 2.5 GB VRAM)}
        - {value: Qwen/Qwen3-TTS-12Hz-1.7B-Base, description: 1.7B Base (better quality, about 4.5 GB VRAM)}

  - variable: qwen3_asr_model
    label: Qwen3-ASR model
    group: Models
    schema:
      type: string
      default: Qwen/Qwen3-ASR-1.7B

  - variable: model_ttl
    label: Free a model after this many idle seconds
    description: >-
      Idle GPU models are unloaded and reload on the next request, so the sum of all models
      need not fit at once. 0 = unload immediately, -1 = never unload.
    group: Models
    schema:
      type: int
      default: 300
      min: -1

  # --- Access ---
  - variable: allowed_origins
    label: Allowed cross-origin callers
    description: >-
      Leave empty. The web UI is same-origin, also over http://<ip>:3000. List origins (comma
      separated) only for scripts running in other web pages; a foreign page is otherwise
      refused with 403.
    group: Access
    schema:
      type: string
      default: ""

  - variable: trusted_origins
    label: Reverse proxy public URL
    description: >-
      Behind an HTTPS reverse proxy that does not pass the original Host header, enter its URL
      (https://voice.example.com; its host name is trusted too). Without it every button
      answers 403. A proxy that does pass Host needs the name under "Host names" below instead.
    group: Access
    schema:
      type: string
      default: ""

  - variable: trusted_hosts
    label: Host names of the web UI (only if not an IP address or *.local)
    description: >-
      Comma-separated. An IP address (192.168.1.20), localhost, *.local, *.lan, *.internal and
      a plain name such as truenas work without an entry. A real domain in front of a reverse
      proxy (voice.example.com) or a Tailscale name (*.tail1234.ts.net) must be listed here,
      or every request answers 403 host_not_allowed.
    group: Access
    schema:
      type: string
      default: ""

  - variable: api_key
    label: API key (optional)
    description: >-
      If set, /v1/*, mutating /api/* calls and the live-transcription socket need
      "Authorization: Bearer <key>". The web UI has no exemption: it asks for the key once per
      browser tab. This is not user authentication.
    group: Access
    schema:
      type: string
      private: true
      default: ""
