# TrueNAS SCALE configuration form for TTS-STT Studio.
#
# This describes the point-and-click options shown when installing the app from
# a custom catalog. The values are consumed by templates/docker-compose.yaml.
#
# NOTE: TrueNAS's app engine renders templates with its internal ix-lib Jinja2
# helpers, which evolve per release. Treat this as a starting scaffold and
# validate on your target TrueNAS version. The fully supported path is
# "Install via YAML" with docker-compose.truenas-app.yml (see truenas/README.md).

groups:
  - name: Network
    description: Host ports exposed by the stack
  - name: Storage
    description: Where persistent data lives on the pool
  - name: GPU
    description: NVIDIA GPU acceleration
  - name: Models
    description: Which models each engine loads
  - name: Backends
    description: Optional, heavier backends (opt-in)
  - name: Access
    description: CORS and browser-facing URLs
  - name: Images
    description: Container image source

questions:
  # --- Network ---
  - variable: frontend_port
    label: Web UI port
    group: Network
    schema:
      type: int
      default: 3000
      required: true

  - variable: expose_backend_ports
    label: Also expose backend service ports (5000-5007, 8080)
    description: >-
      NOT needed for the web UI. Everything the browser uses is proxied through
      the frontend on the Web UI port, including live microphone transcription.
      Turn this on only to call the TTS/STT APIs directly from your own scripts.
    group: Network
    schema:
      type: boolean
      default: false

  # --- Storage ---
  - variable: host_path
    label: Data dataset (host path)
    description: All models, output, caches and training data are stored here.
    group: Storage
    schema:
      type: hostpath
      required: true

  # --- GPU ---
  - variable: use_gpu
    label: Use NVIDIA GPU
    group: GPU
    schema:
      type: boolean
      default: true

  - variable: gpu_device_id
    label: GPU device id
    description: Index of the NVIDIA card to use (single-GPU hosts use 0).
    group: GPU
    schema:
      type: string
      default: "0"
      show_if: [["use_gpu", "=", true]]

  # --- Models ---
  - variable: whisper_model_size
    label: Whisper STT model
    description: >-
      large-v3-turbo is the best latency/accuracy trade for live transcription.
      Choose large-v3 only if you need speech translation, which turbo cannot do.
    group: Models
    schema:
      type: string
      default: large-v3-turbo
      enum:
        - {value: large-v3-turbo, description: large-v3-turbo (recommended — fastest at near-best accuracy)}
        - {value: tiny, description: tiny (fastest, low accuracy)}
        - {value: base, description: base}
        - {value: small, description: small}
        - {value: medium, description: medium (balanced)}
        - {value: large-v3, description: large-v3 (best accuracy, only option that can translate)}

  - variable: qwen3_tts_model
    label: Qwen3-TTS model
    group: Models
    schema:
      type: string
      default: Qwen/Qwen3-TTS-12Hz-0.6B-Base
      enum:
        - {value: Qwen/Qwen3-TTS-12Hz-0.6B-Base, description: 0.6B Base (16 GB friendly)}
        - {value: Qwen/Qwen3-TTS-12Hz-1.7B-Base, description: 1.7B Base (higher quality)}

  - variable: qwen3_asr_model
    label: Qwen3-ASR model
    group: Models
    schema:
      type: string
      default: Qwen/Qwen3-ASR-1.7B

  # --- Backends ---
  - variable: enable_parakeet
    label: Enable Parakeet-ASR (realtime, 25 EU langs incl. German)
    description: Fast multilingual STT. Heavy NeMo image; uses extra VRAM.
    group: Backends
    schema:
      type: boolean
      default: false

  - variable: enable_canary
    label: Enable Canary-ASR (fastest German STT, 180M params)
    description: >-
      NVIDIA canary-180m-flash. Smallest and fastest German STT in the stack.
      Heavy NeMo image; ~2 GB VRAM.
    group: Backends
    schema:
      type: boolean
      default: false

  - variable: enable_chatterbox
    label: Enable Chatterbox-TTS (streaming German TTS + cloning)
    description: >-
      Resemble AI Chatterbox Multilingual (MIT). The only TTS backend that
      streams sentence-by-sentence, so speech starts before the whole text is
      synthesized. ~4 GB VRAM.
    group: Backends
    schema:
      type: boolean
      default: false

  - variable: enable_whisper_cpp
    label: Enable whisper.cpp (CPU, OpenAI-compatible STT)
    group: Backends
    schema:
      type: boolean
      default: false

  - variable: enable_training
    label: Enable voice-training service
    group: Backends
    schema:
      type: boolean
      default: false

  # --- Access ---
  - variable: allowed_origins
    label: Allowed CORS origins
    description: Use "*" for LAN use, or the exact frontend origin in production.
    group: Access
    schema:
      type: string
      default: "*"

  - variable: browser_host
    label: Browser-facing host (legacy — usually leave as-is)
    description: >-
      Only used when "expose backend service ports" is enabled, so that direct
      API callers get correct URLs. The web UI does not need this: it reaches
      every backend through the frontend proxy on the Web UI port.
    group: Access
    schema:
      type: string
      default: localhost

  # --- Images ---
  - variable: image_registry
    label: Image registry / owner
    group: Images
    schema:
      type: string
      default: ghcr.io/steffenhebestreit

  - variable: image_tag
    label: Image tag
    group: Images
    schema:
      type: string
      default: latest
