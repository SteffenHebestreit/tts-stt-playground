# Weekly, grouped update PRs. One PR per ecosystem-and-directory group instead of
# one per package, so a week of releases is a handful of reviews, not dozens.
#
# What is deliberately NOT updated automatically:
#   * torch / torchaudio / nemo_toolkit: pinned by build ARGs in the Dockerfiles,
#     not by requirements files, and coupled to the CUDA base image and to the
#     cu128 wheel index (sm_120 / Blackwell). See each service's README.
#   * The GPU base images (nvidia/cuda, rocm/dev-ubuntu, ubuntu): bumping one
#     changes the driver floor and the Python version together with it.
#   * The Python base image's minor version (python:3.12-slim): requirements are
#     resolved and tested on one minor at a time.
# Those are decisions with a test plan, not routine bumps.
#
# GitHub Actions stay pinned by tag; this keeps the tags fresh.
#
# Every entry sets target-branch: "develop": update PRs go into develop like any other
# change and reach master with the next release (develop -> master), so nothing lands
# on master, and so in the published images, without a release. Dependabot reads this
# file from the default branch (master), so a change here takes effect once released.

version: 2

updates:
  # --- GitHub Actions -------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    target-branch: "develop"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # --- Python requirements (one entry per service, plus the test environment) -------
  - package-ecosystem: pip
    directory: /tests
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}
    # tests/requirements.txt must keep fastapi, jinja2, python-multipart, httpx and
    # uvicorn in lockstep with frontend-service (tests/test_docker_image_contents.py checks it),
    # so those are bumped together, by hand, in the service's own PR.
    ignore:
      - {dependency-name: fastapi}
      - {dependency-name: jinja2}
      - {dependency-name: python-multipart}
      - {dependency-name: httpx}
      - {dependency-name: uvicorn}

  - package-ecosystem: pip
    directory: /frontend-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: pip
    directory: /stt-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: pip
    directory: /piper-tts-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: pip
    directory: /piper-training-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: pip
    directory: /qwen3-asr-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: pip
    directory: /qwen3-tts-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: pip
    directory: /parakeet-asr-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}
    # The NeMo line (3.0.x default, 2.7.x rollback) is chosen by a build ARG.
    ignore:
      - {dependency-name: nemo-toolkit}

  - package-ecosystem: pip
    directory: /canary-asr-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}
    ignore:
      - {dependency-name: nemo-toolkit}

  # The two transformers ASR images: one entry for both directories, so a bump reaches
  # both requirements files in one PR (they must stay identical, see
  # tests/test_transformers_asr_shared.py). transformers is pinned exactly on purpose:
  # re-run benchmarks/run_german_eval.py before merging its bump.
  - package-ecosystem: pip
    directories: [/cohere-asr-service, /granite-asr-service]
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}

  # vllm-asr-service adds only the Silero VAD to its vLLM base (installed --no-deps).
  - package-ecosystem: pip
    directory: /vllm-asr-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: pip
    directory: /chatterbox-tts-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}
    # setuptools<82 is a deliberate cap: resemble-perth imports pkg_resources,
    # which setuptools 82 removed.
    ignore:
      - {dependency-name: setuptools}

  - package-ecosystem: pip
    directory: /magpie-tts-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    commit-message: {prefix: "build(deps)"}
    # The NeMo line (3.0.x) is chosen by a build ARG.
    ignore:
      - {dependency-name: nemo-toolkit}

  # --- Dockerfiles (one entry per directory that holds one) -------------------------------
  # Only the Python and Debian/Ubuntu-flavoured bases that are safe to move are
  # left in; see the header for what is ignored.
  - package-ecosystem: docker
    directory: /frontend-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: python, update-types: [version-update:semver-major, version-update:semver-minor]}

  - package-ecosystem: docker
    directory: /piper-tts-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: python, update-types: [version-update:semver-major, version-update:semver-minor]}

  - package-ecosystem: docker
    directory: /whisper-cpp-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: ubuntu}

  - package-ecosystem: docker
    directory: /stt-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: nvidia/cuda}
      - {dependency-name: rocm/dev-ubuntu-22.04}

  - package-ecosystem: docker
    directory: /piper-training-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: nvidia/cuda}
      - {dependency-name: rocm/dev-ubuntu-22.04}

  - package-ecosystem: docker
    directory: /qwen3-asr-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: nvidia/cuda}
      - {dependency-name: rocm/dev-ubuntu-22.04}

  - package-ecosystem: docker
    directory: /qwen3-tts-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: nvidia/cuda}
      - {dependency-name: rocm/dev-ubuntu-22.04}

  - package-ecosystem: docker
    directory: /parakeet-asr-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: nvidia/cuda}
      - {dependency-name: rocm/dev-ubuntu-22.04}

  - package-ecosystem: docker
    directory: /canary-asr-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: nvidia/cuda}

  - package-ecosystem: docker
    directories: [/cohere-asr-service, /granite-asr-service]
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: nvidia/cuda}

  # vllm/vllm-openai is the engine itself (the release luna-stt runs on the NAS card): a
  # bump changes what every model transcribes and how fast, so re-measure before merging
  # (vllm-asr-service/README.md).
  - package-ecosystem: docker
    directory: /vllm-asr-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}

  - package-ecosystem: docker
    directory: /chatterbox-tts-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: nvidia/cuda}

  - package-ecosystem: docker
    directory: /magpie-tts-service
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: nvidia/cuda}

  - package-ecosystem: docker
    directory: /tests
    target-branch: "develop"
    schedule: {interval: weekly, day: monday}
    groups:
      docker: {patterns: ["*"]}
    commit-message: {prefix: "build(docker)"}
    ignore:
      - {dependency-name: python, update-types: [version-update:semver-major, version-update:semver-minor]}
