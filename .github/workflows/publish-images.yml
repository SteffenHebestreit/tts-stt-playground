name: Publish images to GHCR

# Builds each service image and pushes it to the GitHub Container Registry so the
# stack can be deployed (e.g. on TrueNAS SCALE) without building from source.
#
# Triggers:
#   - git tag  vX.Y.Z   -> publishes :X.Y.Z and :latest
#   - push to master    -> publishes :latest
#   - manual dispatch   -> publishes :<inputs.tag> (default: latest)
#
# Heavy CUDA/NeMo images are large; the free GitHub runners may run out of disk
# or time for some of them. A disk-cleanup step is included; for the largest
# images (parakeet/NeMo, qwen) a larger or self-hosted runner may be required.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: false
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend-service
          - name: piper-tts
            context: ./piper-tts-service
          - name: stt
            context: ./stt-service
          - name: qwen3-asr
            context: ./qwen3-asr-service
          - name: qwen3-tts
            context: ./qwen3-tts-service
          - name: parakeet-asr
            context: ./parakeet-asr-service
          - name: whisper-cpp
            context: ./whisper-cpp-service
          - name: piper-training
            context: ./piper-training-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space (large GPU images)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tts-stt-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
