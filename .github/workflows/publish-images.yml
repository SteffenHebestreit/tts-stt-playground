name: Publish images to GHCR

# Builds each service image and pushes it to the GitHub Container Registry so the
# stack can be deployed (e.g. on TrueNAS SCALE, or on an ARM SBC) without
# building from source.
#
# Triggers:
#   - git tag  vX.Y.Z   -> publishes :X.Y.Z and :latest
#   - push to master    -> publishes :latest
#   - manual dispatch   -> publishes :<inputs.tag> (default: latest)
#
# ---------------------------------------------------------------------------
# ARCHITECTURES
# ---------------------------------------------------------------------------
# Three services are published as multi-arch (linux/amd64 + linux/arm64) so they
# can run on an ARM SBC such as the Rockchip RK3588S:
#   frontend, piper-tts, whisper-cpp
#
# Every other service is amd64-only ON PURPOSE. They are built on nvidia/cuda:*
# bases, and NeMo / Qwen / Chatterbox all require CUDA. An arm64 build would
# either fail outright or produce an image that cannot start — which is worse,
# because it looks supported. Do not add them to the arm64 list.
#
# arm64 is built on NATIVE GitHub-hosted arm64 runners, not QEMU. whisper-cpp
# compiles ggml from source; under QEMU that build takes hours.
#
# Each architecture is pushed BY DIGEST (no tag), and a final merge job assembles
# the manifest list. Two jobs must never push the same tag — the second would
# silently replace the first rather than adding to it.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: false
        default: latest

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/tts-stt-

jobs:
  build:
    name: build ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- multi-arch: the only services that can run on ARM64 -----------
          - { name: frontend,       context: ./frontend-service,        arch: amd64, runner: ubuntu-latest }
          - { name: frontend,       context: ./frontend-service,        arch: arm64, runner: ubuntu-24.04-arm }
          - { name: piper-tts,      context: ./piper-tts-service,       arch: amd64, runner: ubuntu-latest }
          - { name: piper-tts,      context: ./piper-tts-service,       arch: arm64, runner: ubuntu-24.04-arm }
          - { name: whisper-cpp,    context: ./whisper-cpp-service,     arch: amd64, runner: ubuntu-latest }
          - { name: whisper-cpp,    context: ./whisper-cpp-service,     arch: arm64, runner: ubuntu-24.04-arm }
          # --- amd64 only: CUDA / NeMo / PyTorch-GPU services ----------------
          - { name: stt,            context: ./stt-service,             arch: amd64, runner: ubuntu-latest }
          - { name: qwen3-asr,      context: ./qwen3-asr-service,       arch: amd64, runner: ubuntu-latest }
          - { name: qwen3-tts,      context: ./qwen3-tts-service,       arch: amd64, runner: ubuntu-latest }
          - { name: parakeet-asr,   context: ./parakeet-asr-service,    arch: amd64, runner: ubuntu-latest }
          - { name: canary-asr,     context: ./canary-asr-service,      arch: amd64, runner: ubuntu-latest }
          - { name: chatterbox-tts, context: ./chatterbox-tts-service,  arch: amd64, runner: ubuntu-latest }
          - { name: piper-training, context: ./piper-training-service,  arch: amd64, runner: ubuntu-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space (large GPU images)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only. Tags are applied by the merge job, so the two
      # per-arch builds of one service cannot overwrite each other's tag.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.name }},push-by-digest=true,name-canonical=true
          # Scope must include the arch, or the two builds fight over one cache.
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # The digest is "sha256:<hex>"; the merge job re-adds the prefix, so
          # store just the hex as the filename. Strip in the shell — GitHub
          # Actions expressions have no parameter-expansion syntax.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: manifest ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        name:
          - frontend
          - piper-tts
          - whisper-cpp
          - stt
          - qwen3-asr
          - qwen3-tts
          - parakeet-asr
          - canary-asr
          - chatterbox-tts
          - piper-training
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.name }}
          tags: |
            # Tag vX.Y.Z publishes :X.Y.Z and :latest (TrueNAS pins versions without the "v")
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short

      # Assembles one manifest list per tag from whichever per-arch digests
      # exist. Services with only an amd64 digest get a single-entry list, which
      # is exactly the previous behaviour.
      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.name }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.name }}:${{ steps.meta.outputs.version }}"
